databases:
  - name: upay-resolveai-db
    databaseName: upay_resolveai
    user: upay_user
    plan: free

services:
  - type: web
    name: upay-resolveai-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: upay-resolveai-db
          property: connectionString
      - key: DEMO_AI_MODE
        value: "true"
      - key: AI_PROVIDER
        value: "demo_deterministic"
      - key: CORS_ORIGINS
        value: '["*"]'
